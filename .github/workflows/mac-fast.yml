name: Build SYNC (macOS fast lane)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, macos-13]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log || { tail -25 configure.log | sed 's/^/::error::/'; exit 1; }

      - name: Build VST3 + AU + Standalone (Universal)
        run: |
          set -o pipefail
          cmake --build build --config Release --target SYNC_VST3 SYNC_AU SYNC_Standalone --parallel 4 2>&1 | tee build.log || { grep -i "error" build.log | head -25 | sed 's/^/::error::/'; exit 1; }

      - name: Package (.pkg)
        run: |
          A=build/SYNC_artefacts/Release
          mkdir -p dist pkgroot/vst3 pkgroot/au pkgroot/app
          cp -R "$A/VST3/SYNC.vst3" pkgroot/vst3/
          cp -R "$A/AU/SYNC.component" pkgroot/au/
          cp -R "$A/Standalone/SYNC.app" pkgroot/app/
          for b in pkgroot/vst3/SYNC.vst3 pkgroot/au/SYNC.component pkgroot/app/SYNC.app; do codesign --force --deep -s - "$b"; done
          pkgbuild --root pkgroot/vst3 --identifier com.offkey555.sync.vst3 --version 1.0.0 --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root pkgroot/au   --identifier com.offkey555.sync.au   --version 1.0.0 --install-location "/Library/Audio/Plug-Ins/Components" au.pkg
          pkgbuild --root pkgroot/app  --identifier com.offkey555.sync.app  --version 1.0.0 --install-location "/Applications" app.pkg
          productbuild --package vst3.pkg --package au.pkg --package app.pkg dist/SYNC-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: SYNC-macOS
          path: dist/SYNC-macOS.pkg

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sync-v1.0
          name: SYNC v1.0
          target_commitish: ${{ github.sha }}
          files: dist/SYNC-macOS.pkg
