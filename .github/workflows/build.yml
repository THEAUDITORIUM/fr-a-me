name: Build SYNC

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { Get-Content configure.log -Tail 25 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }

      - name: Build VST3 + Standalone
        shell: pwsh
        run: |
          cmake --build build --config Release --target SYNC_VST3 SYNC_Standalone --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path build.log -Pattern "error" | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$($_.Line)" }; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/SYNC_artefacts/Release/VST3/SYNC.vst3" dist/
          Copy-Item "build/SYNC_artefacts/Release/Standalone/SYNC.exe" dist/
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss
          Compress-Archive -Path dist/SYNC.vst3, dist/SYNC.exe -DestinationPath dist/SYNC-Windows-manual.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SYNC-Windows
          path: |
            dist/SYNC-Windows-Installer.exe
            dist/SYNC-Windows-manual.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log || { tail -25 configure.log | sed 's/^/::error::/'; exit 1; }

      - name: Build VST3 + AU + Standalone (Universal)
        run: |
          set -o pipefail
          cmake --build build --config Release --target SYNC_VST3 SYNC_AU SYNC_Standalone --parallel 4 2>&1 | tee build.log || { grep -i "error" build.log | head -25 | sed 's/^/::error::/'; exit 1; }

      - name: Package (.pkg)
        run: |
          A=build/SYNC_artefacts/Release
          mkdir -p dist pkgroot/vst3 pkgroot/au pkgroot/app
          cp -R "$A/VST3/SYNC.vst3" pkgroot/vst3/
          cp -R "$A/AU/SYNC.component" pkgroot/au/
          cp -R "$A/Standalone/SYNC.app" pkgroot/app/
          for b in pkgroot/vst3/SYNC.vst3 pkgroot/au/SYNC.component pkgroot/app/SYNC.app; do codesign --force --deep -s - "$b"; done
          pkgbuild --root pkgroot/vst3 --identifier com.offkey555.sync.vst3 --version 1.0.0 --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root pkgroot/au   --identifier com.offkey555.sync.au   --version 1.0.0 --install-location "/Library/Audio/Plug-Ins/Components" au.pkg
          pkgbuild --root pkgroot/app  --identifier com.offkey555.sync.app  --version 1.0.0 --install-location "/Applications" app.pkg
          productbuild --package vst3.pkg --package au.pkg --package app.pkg dist/SYNC-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: SYNC-macOS
          path: dist/SYNC-macOS.pkg
